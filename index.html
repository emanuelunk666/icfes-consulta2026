<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Consulta ICFES 2026</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class'
    }
  </script>
  <style>
    body {
      transition: background-color 0.3s, color 0.3s;
    }
  </style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900 dark:bg-[#0f172a] dark:text-white flex flex-col items-center px-4 py-8 transition-colors">

  <!-- Header -->
  <div class="w-full max-w-md flex items-center justify-between mb-8">
    <div class="flex items-center gap-3">
      <div class="w-11 h-11 bg-blue-600 rounded-xl flex items-center justify-center font-bold text-lg text-white shadow-lg">
        I
      </div>
      <div>
        <h1 class="font-semibold text-lg">Consulta ICFES</h1>
        <p class="text-xs text-slate-500 dark:text-gray-400">Resultados Saber 11</p>
      </div>
    </div>

    <div class="flex items-center gap-3">
      <!-- Indicador API -->
      <div class="hidden sm:flex items-center gap-2 text-xs bg-green-500/10 text-green-600 dark:text-green-400 px-3 py-1.5 rounded-full border border-green-500/20">
        <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>
        API activa
      </div>

      <!-- Botón modo claro/oscuro -->
      <button onclick="toggleTheme()" class="w-10 h-10 rounded-xl bg-slate-200 dark:bg-slate-700 flex items-center justify-center hover:scale-105 transition">
        <span id="themeIcon">🌙</span>
      </button>
    </div>
  </div>

  <!-- Card principal -->
  <div class="w-full max-w-md bg-white dark:bg-[#1e293b] rounded-2xl p-6 shadow-xl border border-slate-200 dark:border-white/5">
    <h2 class="text-xl font-semibold mb-1">Consulta tu puntaje</h2>
    <p class="text-sm text-slate-500 dark:text-gray-400 mb-6">Ingresa tus datos para verificar tu registro</p>

    <!-- Formulario -->
    <div class="space-y-4">
      <div>
        <label class="text-xs text-slate-500 dark:text-gray-400 mb-1 block">Tipo de documento</label>
        <select id="tipoDocumento" class="w-full bg-slate-50 dark:bg-[#0f172a] border border-slate-200 dark:border-white/10 rounded-xl px-4 py-3 text-sm outline-none focus:border-blue-500 dark:text-white">
          <option value="TI">Tarjeta de Identidad (TI)</option>
          <option value="CC">Cédula de Ciudadanía (CC)</option>
          <option value="CE">Cédula de Extranjería (CE)</option>
          <option value="PA">Pasaporte (PA)</option>
        </select>
      </div>

      <div>
        <label class="text-xs text-slate-500 dark:text-gray-400 mb-1 block">Número de documento</label>
        <input id="numeroDocumento" type="text" placeholder="Ej: 1098765432"
          class="w-full bg-slate-50 dark:bg-[#0f172a] border border-slate-200 dark:border-white/10 rounded-xl px-4 py-3 text-sm outline-none focus:border-blue-500 dark:text-white" />
      </div>

      <div>
        <label class="text-xs text-slate-500 dark:text-gray-400 mb-1 block">Fecha de nacimiento</label>
