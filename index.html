<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Consulta Resultados ICFES | Saber 11</title>
  <meta name="description" content="Consulta tus resultados del ICFES Saber 11 de forma rápida y sencilla. Ingresa tu documento y fecha de nacimiento." />
  <meta name="theme-color" content="#8f4cfc" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0b0a1a;
      --bg-card: rgba(255, 255, 255, 0.05);
      --border: rgba(255, 255, 255, 0.1);
      --primary: #8f4cfc;
      --primary-hover: #7a3de0;
      --primary-glow: rgba(143, 76, 252, 0.35);
      --success: #00e676;
      --error: #ff4d6d;
      --text: #f4f4f8;
      --text-muted: #9b9bb0;
      --radius: 14px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(143, 76, 252, 0.25), transparent),
        radial-gradient(ellipse 60% 40% at 80% 100%, rgba(76, 144, 252, 0.12), transparent);
      min-height: 100vh;
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem 3rem;
    }

    .container {
      width: 100%;
      max-width: 460px;
    }

    header {
      text-align: center;
      margin-bottom: 1.75rem;
    }

    header h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, #c084fc, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.92rem;
      margin-top: 0.35rem;
    }

    .card {
      background: var(--bg-card);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.6rem;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
    }

    .form-group {
      margin-bottom: 1.15rem;
    }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 0.35rem;
      letter-spacing: 0.01em;
    }

    select, input {
      width: 100%;
      padding: 0.72rem 0.95rem;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 0.95rem;
      font-family: inherit;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
    }

    select:focus, input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-glow);
    }

    select option {
      background: #1a1830;
      color: var(--text);
    }

    button[type="submit"] {
      width: 100%;
      padding: 0.85rem;
      margin-top: 0.35rem;
      background: linear-gradient(135deg, var(--primary), #6d28d9);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.2s, opacity 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    button[type="submit"]:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px var(--primary-glow);
    }

    button[type="submit"]:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2.5px solid rgba(255,255,255,0.25);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.65s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Results */
    #result {
      margin-top: 1.35rem;
      display: none;
    }

    #result.show {
      display: block;
      animation: slideUp 0.3s ease;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .alert {
      padding: 0.9rem 1.1rem;
      border-radius: 10px;
      font-size: 0.88rem;
      line-height: 1.5;
    }

    .alert-error {
      background: rgba(255, 77, 109, 0.12);
      border: 1px solid rgba(255, 77, 109, 0.35);
      color: #ff8fa3;
    }

    .alert-success {
      background: rgba(0, 230, 118, 0.1);
      border: 1px solid rgba(0, 230, 118, 0.3);
      color: #69f0ae;
    }

    .alert-info {
      background: rgba(96, 165, 250, 0.1);
      border: 1px solid rgba(96, 165, 250, 0.3);
      color: #93c5fd;
    }

    pre {
      background: rgba(0, 0, 0, 0.4);
      border-radius: 10px;
      padding: 1rem;
      overflow: auto;
      font-size: 0.75rem;
      line-height: 1.55;
      color: #c8c8d8;
      margin-top: 0.75rem;
      max-height: 380px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* Nice result cards (if we get structured data later) */
    .score-card {
      background: rgba(0,0,0,0.25);
      border-radius: 10px;
      padding: 1rem;
      margin-top: 0.75rem;
      border: 1px solid var(--border);
    }

    .score-card h3 {
      font-size: 0.95rem;
      margin-bottom: 0.5rem;
    }

    footer {
      margin-top: 2.5rem;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.75rem;
      line-height: 1.6;
    }

    footer a {
      color: #a78bfa;
      text-decoration: none;
    }

    .badge {
      display: inline-block;
      background: rgba(143, 76, 252, 0.15);
      color: #c4b5fd;
      font-size: 0.7rem;
      font-weight: 600;
      padding: 0.2rem 0.55rem;
      border-radius: 999px;
      margin-bottom: 0.6rem;
      letter-spacing: 0.03em;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="badge">ICFES · RESULTADOS</div>
      <h1>Consulta tu puntaje</h1>
      <p>Ingresa tus datos para ver tus resultados del examen</p>
    </header>

    <div class="card">
      <form id="form">
        <div class="form-group">
          <label for="tipoDocumento">Tipo de documento</label>
          <select id="tipoDocumento" required>
            <option value="CC">Cédula de Ciudadanía (CC)</option>
            <option value="TI" selected>Tarjeta de Identidad (TI)</option>
            <option value="CE">Cédula de Extranjería (CE)</option>
            <option value="PA">Pasaporte (PA)</option>
            <option value="RC">Registro Civil (RC)</option>
            <option value="NUIP">NUIP</option>
          </select>
        </div>

        <div class="form-group">
          <label for="numeroDocumento">Número de documento</label>
          <input
            type="text"
            id="numeroDocumento"
            placeholder="Ej: 1098765432"
            required
            inputmode="numeric"
            pattern="[0-9A-Za-z]*"
            autocomplete="off"
          />
        </div>

        <div class="form-group">
          <label for="fechaNacimiento">Fecha de nacimiento</label>
          <input
            type="date"
            id="fechaNacimiento"
            required
            max="2012-12-31"
          />
        </div>

        <button type="submit" id="btn">
          Consultar resultados
        </button>
      </form>

      <div id="result"></div>
    </div>

    <footer>
      <p>Esta herramienta consulta el backend oficial del ICFES.</p>
      <p style="opacity: 0.7; margin-top: 0.25rem;">
        No almacena tus datos personales.
      </p>
    </footer>
  </div>

  <script>
    const form = document.getElementById('form');
    const btn = document.getElementById('btn');
    const resultEl = document.getElementById('result');

    function showResult(type, message, data = null) {
      resultEl.classList.add('show');
      let html = `<div class="alert alert-${type}">${message}</div>`;

      if (data) {
        // Si la respuesta tiene estructura útil, se puede mejorar aquí
        html += `<pre>${JSON.stringify(data, null, 2)}</pre>`;
      }

      resultEl.innerHTML = html;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const tipoDocumento = document.getElementById('tipoDocumento').value;
      const numeroDocumento = document.getElementById('numeroDocumento').value.trim();
      const fechaNacimiento = document.getElementById('fechaNacimiento').value;

      if (!numeroDocumento || !fechaNacimiento) {
        showResult('error', 'Por favor completa todos los campos.');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = `<span class="spinner"></span> Consultando...`;
      resultEl.classList.remove('show');
      resultEl.innerHTML = '';

      try {
        const res = await fetch('/api/consulta', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            tipoDocumento,
            numeroDocumento,
            fechaNacimiento
          })
        });

        const json = await res.json();

        if (!res.ok || json.success === false) {
          const msg = json.error || 'No se encontraron resultados o hubo un error.';
          showResult('error', msg, json.data || null);
          return;
        }

        // Éxito
        showResult(
          'success',
          '¡Consulta realizada con éxito!',
          json.data
        );

      } catch (err) {
        console.error(err);
        showResult(
          'error',
          'No se pudo conectar con el servidor. Verifica tu conexión o intenta más tarde.'
        );
      } finally {
        btn.disabled = false;
        btn.innerHTML = 'Consultar resultados';
      }
    });
  </script>
</body>
</html>
