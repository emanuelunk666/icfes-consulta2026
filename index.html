<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Consulta ICFES 2026</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script>
    tailwind.config = { darkMode: 'class' }
  </script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-900 dark:bg-[#0b1220] dark:text-white flex flex-col items-center px-4 py-8">

  <!-- Header -->
  <div class="w-full max-w-md flex items-center justify-between mb-8">
    <div class="flex items-center gap-3">
      <div class="w-11 h-11 bg-[#009ca6] rounded-xl flex items-center justify-center font-bold text-lg text-white shadow">
        I
      </div>
      <div>
        <h1 class="font-semibold text-lg">Consulta ICFES</h1>
        <p class="text-xs text-slate-500 dark:text-gray-400">Resultados Saber 11 · 2026</p>
      </div>
    </div>

    <div class="flex items-center gap-3">
      <div class="hidden sm:flex items-center gap-2 text-xs bg-green-500/10 text-green-600 dark:text-green-400 px-3 py-1.5 rounded-full border border-green-500/20">
        <span class="w-2 h-2 bg-green-500 rounded-full"></span>
        API activa
      </div>
      <button onclick="toggleTheme()" class="w-10 h-10 rounded-xl bg-slate-200 dark:bg-slate-700 flex items-center justify-center text-lg">
        <span id="themeIcon">🌙</span>
      </button>
    </div>
  </div>

  <!-- Card de consulta -->
  <div class="w-full max-w-md bg-white dark:bg-[#151d2e] rounded-2xl p-6 shadow-xl border border-slate-200 dark:border-white/5">
    <h2 class="text-xl font-semibold mb-1">Consulta tu puntaje</h2>
    <p class="text-sm text-slate-500 dark:text-gray-400 mb-6">Ingresa los datos con los que te registraste</p>

    <div class="space-y-4">
      <div>
        <label class="text-xs text-slate-500 dark:text-gray-400 mb-1 block">Tipo de documento</label>
        <select id="tipoDocumento" class="w-full bg-slate-50 dark:bg-[#0b1220] border border-slate-200 dark:border-white/10 rounded-xl px-4 py-3 text-sm">
          <option value="TI">Tarjeta de Identidad (TI)</option>
          <option value="CC">Cédula de Ciudadanía (CC)</option>
          <option value="CE">Cédula de Extranjería (CE)</option>
          <option value="CR">Contraseña (CR)</option>
          <option value="PEP">Permiso Especial (PEP)</option>
          <option value="PPT">Permiso por Protección Temporal (PPT)</option>
          <option value="NES">Número de Establecimiento (NES)</option>
          <option value="PA">Pasaporte (PA)</option>
        </select>
      </div>

      <div>
        <label class="text-xs text-slate-500 dark:text-gray-400 mb-1 block">Número de documento</label>
        <input id="numeroDocumento" type="text" placeholder="Ej: 1098765432" class="w-full bg-slate-50 dark:bg-[#0b1220] border border-slate-200 dark:border-white/10 rounded-xl px-4 py-3 text-sm" />
      </div>

      <div>
        <label class="text-xs text-slate-500 dark:text-gray-400 mb-1 block">Fecha de nacimiento</label>
        <input 
          id="fechaNacimiento" 
          type="text" 
          placeholder="dd/mm/aaaa" 
          maxlength="10"
          class="w-full bg-slate-50 dark:bg-[#0b1220] border border-slate-200 dark:border-white/10 rounded-xl px-4 py-3 text-sm"
          oninput="this.value = this.value
            .replace(/\D/g, '')
            .replace(/^(\d{2})(\d)/, '$1/$2')
            .replace(/^(\d{2}\/\d{2})(\d)/, '$1/$2')
            .slice(0, 10)"
        />
      </div>

      <div>
        <label class="text-xs text-slate-500 dark:text-gray-400 mb-1 block">Número de registro <span class="opacity-60">(opcional)</span></label>
        <input id="numeroRegistro" type="text" placeholder="Ej: AC202631012061" class="w-full bg-slate-50 dark:bg-[#0b1220] border border-slate-200 dark:border-white/10 rounded-xl px-4 py-3 text-sm" />
      </div>

      <button onclick="consultar()" id="btnConsultar" class="w-full bg-[#009ca6] hover:bg-[#008892] text-white font-medium py-3.5 rounded-xl transition">
        Consultar resultados
      </button>
    </div>

    <!-- Contacto -->
    <div class="mt-5 p-4 rounded-xl bg-slate-50 dark:bg-[#0b1220] border border-slate-200 dark:border-white/10 text-center text-sm">
      <p class="text-slate-500 dark:text-gray-400 mb-3">¿Problemas con la consulta?</p>
      <div class="flex flex-col sm:flex-row justify-center gap-3">
        <a 
          href="https://wa.me/573192463799?text=Hola%2C%20necesito%20ayuda%20consultando%20mis%20resultados%20del%20ICFES"
          target="_blank"
          class="inline-flex items-center justify-center gap-2 text-green-600 dark:text-green-400 hover:underline font-medium"
        >
          💬 WhatsApp
        </a>
        <a 
          href="https://www.tiktok.com/@emanuelunk"
          target="_blank"
          class="inline-flex items-center justify-center gap-2 text-pink-500 hover:underline font-medium"
        >
          🎵 TikTok
        </a>
      </div>
    </div>

    <div id="error" class="hidden mt-4 p-3 rounded-xl bg-red-50 dark:bg-red-500/10 border border-red-200 dark:border-red-500/20 text-red-600 dark:text-red-300 text-sm text-center"></div>
  </div>

  <!-- Resultados -->
  <div id="resultados" class="w-full max-w-md mt-6 hidden"></div>

  <p class="mt-8 text-xs text-slate-400 dark:text-gray-500 text-center max-w-md">
    Esta herramienta consulta el backend oficial del ICFES.<br>
    No almacena tus datos personales.
  </p>

  <script>
    function toggleTheme() {
      document.documentElement.classList.toggle('dark');
      const isDark = document.documentElement.classList.contains('dark');
      document.getElementById('themeIcon').textContent = isDark ? '☀️' : '🌙';
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    }

    if (localStorage.getItem('theme') === 'dark') {
      document.documentElement.classList.add('dark');
      document.getElementById('themeIcon').textContent = '☀️';
    }

    async function consultar() {
      const tipoDocumento = document.getElementById('tipoDocumento').value;
      const numeroDocumento = document.getElementById('numeroDocumento').value.trim();
      const fechaNacimiento = document.getElementById('fechaNacimiento').value.trim();
      const numeroRegistro = document.getElementById('numeroRegistro').value.trim();
      const btn = document.getElementById('btnConsultar');
      const errorDiv = document.getElementById('error');
      const resultadosDiv = document.getElementById('resultados');

      errorDiv.classList.add('hidden');
      resultadosDiv.classList.add('hidden');
      resultadosDiv.innerHTML = '';

      if (!numeroDocumento || !fechaNacimiento) {
        errorDiv.textContent = 'Por favor completa número de documento y fecha de nacimiento';
        errorDiv.classList.remove('hidden');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Consultando...';

      try {
        const res = await fetch('/api/consulta', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            tipoDocumento,
            numeroDocumento,
            fechaNacimiento,
            numeroRegistro: numeroRegistro || ''
          })
        });

        const data = await res.json();

        if (data.success && data.puntajeGlobal !== undefined) {
          mostrarResultadosCompletos(data);
          return;
        }

        if (data.success === false) {
          errorDiv.textContent = data.message || data.error || 'No se encontraron resultados';
          errorDiv.classList.remove('hidden');
          return;
        }

        errorDiv.textContent = 'No se encontraron resultados con esos datos';
        errorDiv.classList.remove('hidden');

      } catch (err) {
        errorDiv.textContent = err.message || 'Error al consultar';
        errorDiv.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Consultar resultados';
      }
    }

    function mostrarResultadosCompletos(data) {
      const resultadosDiv = document.getElementById('resultados');

      const pruebasHTML = (data.pruebas || []).map(p => `
        <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #e5e7eb;">
          <div>
            <p style="font-weight:600;font-size:14px;margin:0 0 2px 0;">${p.nombrePrueba}</p>
            <p style="font-size:12px;color:#6b7280;margin:0;">Percentil ${p.percentilNacional || '—'} · Nivel ${p.nivelDesempeno || '—'}</p>
          </div>
          <div style="font-size:22px;font-weight:700;color:#009ca6;">${p.puntajePrueba}</div>
        </div>
      `).join('');

      resultadosDiv.innerHTML = `
        <div id="pdf-content" style="background:#ffffff;border-radius:16px;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,0.1);font-family:Arial,sans-serif;">
          
          <div style="background:#009ca6;color:white;padding:24px;">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
              <span style="font-size:11px;background:rgba(255,255,255,0.2);padding:4px 10px;border-radius:999px;">SABER 11 · 2026</span>
              <span style="font-size:11px;opacity:0.8;">OFICIAL ICFES</span>
            </div>
            <p style="font-size:14px;opacity:0.9;margin:0 0 4px 0;">${data.estudiante || 'Estudiante'}</p>
            <div style="display:flex;align-items:flex-end;gap:8px;">
              <span style="font-size:48px;font-weight:700;line-height:1;">${data.puntajeGlobal}</span>
              <span style="font-size:18px;opacity:0.8;margin-bottom:6px;">/ 500</span>
            </div>
            <p style="font-size:14px;margin:8px 0 0 0;opacity:0.9;">Percentil nacional: <strong>${data.percentilNacional}%</strong></p>
            <p style="font-size:12px;margin:4px 0 0 0;opacity:0.7;">Registro: ${data.registro || '—'}</p>
          </div>

          <div style="padding:20px 24px;">
            <h3 style="font-size:11px;font-weight:600;color:#6b7280;text-transform:uppercase;letter-spacing:0.05em;margin:0 0 12px 0;">Desglose por prueba</h3>
            ${pruebasHTML}
          </div>
        </div>

        <div style="display:flex;gap:12px;margin-top:16px;">
          <button onclick="descargarPDF()" style="flex:1;background:#009ca6;color:white;font-weight:500;padding:12px;border-radius:12px;border:none;cursor:pointer;font-size:14px;">
            📄 Descargar PDF
          </button>
          <button onclick="window.print()" style="flex:1;background:#e5e7eb;color:#374151;font-weight:500;padding:12px;border-radius:12px;border:none;cursor:pointer;font-size:14px;">
            🖨️ Imprimir
          </button>
        </div>
      `;

      resultadosDiv.classList.remove('hidden');
      resultadosDiv.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function descargarPDF() {
      const dataElement = document.getElementById('pdf-content');
      if (!dataElement) {
        alert('No hay resultados para descargar');
        return;
      }

      // Contenedor limpio solo para el PDF
      const temp = document.createElement('div');
      temp.style.position = 'fixed';
      temp.style.left = '-9999px';
      temp.style.top = '0';
      temp.style.width = '700px';
      temp.style.background = '#ffffff';
      temp.style.padding = '20px';
      temp.style.fontFamily = 'Arial, sans-serif';
      temp.innerHTML = dataElement.innerHTML;

      document.body.appendChild(temp);

      const opt = {
        margin:       0.5,
        filename:     'Resultados_ICFES_Saber11.pdf',
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { 
          scale: 2,
          useCORS: true,
          backgroundColor: '#ffffff',
          logging: false,
          windowWidth: 700
        },
        jsPDF:        { unit: 'in', format: 'letter', orientation: 'portrait' }
      };

      html2pdf().set(opt).from(temp).save().then(() => {
        document.body.removeChild(temp);
      }).catch(() => {
        document.body.removeChild(temp);
        alert('Error al generar el PDF. Usa el botón Imprimir y elige "Guardar como PDF".');
      });
    }
  </script>
</body>
</html>
